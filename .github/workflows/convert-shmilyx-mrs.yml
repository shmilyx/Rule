name: Convert shmilyx List to MRS

on:
  push:
    paths:  # 只在 list 文件变化时触发
      - 'Xdirect.list'
      - 'x.list'
  workflow_dispatch:  # 保留手动触发

permissions:
  contents: write  # 授予写权限

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Pull Latest Changes  # 新增：拉取远程最新变化，解决分歧
      run: git pull origin main --rebase

    - name: Setup mihomo
      run: |
        # 下载最新 mihomo Linux 二进制（v1.19.14，2025-10-06 最新）
        wget https://github.com/MetaCubeX/mihomo/releases/download/v1.19.14/mihomo-linux-amd64-v1.19.14.gz
        gunzip mihomo-linux-amd64-v1.19.14.gz
        chmod +x mihomo-linux-amd64-v1.19.14
        sudo mv mihomo-linux-amd64-v1.19.14 /usr/local/bin/mihomo

    - name: Download and Convert Files
      run: |
        # 下载并转换 Xdirect.list（假设 domain 类型）
        wget -O Xdirect.list "https://raw.githubusercontent.com/shmilyx/Rule/main/Xdirect.list"
        mihomo convert-ruleset domain text Xdirect.list Xdirect.mrs
        rm Xdirect.list

        # 下载并转换 x.list（假设 domain 类型）
        wget -O x.list "https://raw.githubusercontent.com/shmilyx/Rule/main/x.list"
        mihomo convert-ruleset domain text x.list x.mrs
        rm x.list

        echo "转换完成：Xdirect.mrs 和 x.mrs"

    - name: Commit MRS Files
      uses: stefanzweifel/git-auto-commit-action@v6  # 更新到 v6
      with:
        commit_message: "Auto-update MRS from shmilyx/Rule lists"
        file_pattern: "*.mrs"
